AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Copies the latest AWS Storage Gateway FILE_S3 AMI from the AWS-owned SSM public
  parameter (/aws/service/storagegateway/ami/FILE_S3/latest) into the Operations
  account using a Lambda custom resource. No Image Builder build instance is launched
  — copy, encrypt with CMK, tag, and share with the org only.
  Root cause fixed: Storage Gateway AMIs have no SSM Agent, so ImageBuilder's
  ssm:SendCommand (LaunchBuildInstance step) always returns InvalidInstanceId.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  StorageGatewaySsmPath:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/storagegateway/ami/FILE_S3/latest
    Description: >
      AWS-owned SSM public parameter that resolves to the Storage Gateway FILE_S3 AMI.
      CloudFormation resolves this at deploy/update time. Used as a cache-buster so a
      stack update triggers a new copy when AWS releases a new AMI version.

  KMSKeyUSE2:
    Type: String
    Default: "arn:aws:kms:us-east-2:111111111111:alias/sourceamikey"

  KMSKeyUSE1:
    Type: String
    Default: "arn:aws:kms:us-east-1:111111111111:alias/sourceamikey"

  AppName:
    Type: String
    Default: "PRASAN-AWS-STORAGEGATEWAY-FILE-S3-CF"

  OrganizationArn:
    Type: String
    Default: "arn:aws:organizations::222222222222:organization/o-iefvwevvb"

  DevDistributionAccountId:
    Type: String
    Default: "333333333333"
    Description: >
      AWS account ID that receives launch permission in dev. Only a single
      account is targeted (not the whole org) to limit blast radius in non-prod.

  CostCenter:
    Type: String
    Default: "Test-Stacks"

  Environment:
    Type: String
    AllowedValues: [dev, prd]
    Default: dev

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  IsProd: !Equals [!Ref Environment, prd]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── CloudWatch Log Group for Lambda ─────────────────────────────────────────

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-ami-copy"
      RetentionInDays: 90

  # ── IAM Role ─────────────────────────────────────────────────────────────────

  AmiCopyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AmiCopyPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EC2Permissions
                Effect: Allow
                Action:
                  - ec2:CopyImage
                  - ec2:DescribeImages
                  - ec2:ModifyImageAttribute
                  - ec2:CreateTags
                  - ec2:DeregisterImage
                  - ec2:DeleteSnapshot
                Resource: "*"
              - Sid: KMSPermissions
                Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:DescribeKey
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                Resource: "*"
              - Sid: SSMInternalParam
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:AddTagsToResource
                Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/internal/amis/storage-gateway/*"
              - Sid: SSMPublicParam
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: "arn:aws:ssm:*::parameter/aws/service/storagegateway/*"

  # ── Lambda Function ──────────────────────────────────────────────────────────
  # Handles both CloudFormation Custom Resource invocations (Create/Update/Delete)
  # and direct EventBridge scheduled invocations for weekly AMI refresh.

  AmiCopyLambda:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub "${AppName}-ami-copy"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AmiCopyLambdaRole.Arn
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          APP_NAME: !Ref AppName
          ORG_ARN: !Ref OrganizationArn
          KMS_KEY_USE2: !Ref KMSKeyUSE2
          KMS_KEY_USE1: !Ref KMSKeyUSE1
          SSM_PARAM: "/internal/amis/storage-gateway/file-s3/latest"
          ENVIRONMENT: !Ref Environment
          DEV_ACCOUNT_ID: !Ref DevDistributionAccountId
      Tags:
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: GatewayType
          Value: "FILE_S3"
      Code:
        ZipFile: |
          import boto3, cfnresponse, json, os, time

          APP_NAME    = os.environ['APP_NAME']
          ORG_ARN     = os.environ['ORG_ARN']
          KMS_USE2    = os.environ['KMS_KEY_USE2']
          KMS_USE1    = os.environ['KMS_KEY_USE1']
          SSM_PARAM   = os.environ['SSM_PARAM']
          ENVIRONMENT = os.environ['ENVIRONMENT']
          DEV_ACCOUNT = os.environ['DEV_ACCOUNT_ID']
          AMI_NAME    = f'{APP_NAME}-storagegateway-file-s3'

          COMMON_TAGS = [
              {'Key': 'GatewayType',    'Value': 'FILE_S3'},
              {'Key': 'SourceSsmParam', 'Value': '/aws/service/storagegateway/ami/FILE_S3/latest'},
              {'Key': 'ManagedBy',      'Value': 'CloudFormation'},
              {'Key': 'auto-delete',    'Value': 'no'},
              {'Key': 'Prasan_OS',      'Value': 'True'},
          ]


          def resolve_sg_ami(region):
              ssm = boto3.client('ssm', region_name=region)
              return ssm.get_parameter(
                  Name='/aws/service/storagegateway/ami/FILE_S3/latest'
              )['Parameter']['Value']


          def start_copy(ec2_client, src_ami, kms_key, src_region):
              r = ec2_client.copy_image(
                  Name=AMI_NAME,
                  Description=f'Ops-owned Storage Gateway FILE_S3 AMI copied from {src_ami}',
                  SourceImageId=src_ami,
                  SourceRegion=src_region,
                  Encrypted=True,
                  KmsKeyId=kms_key,
                  CopyImageTags=True,
              )
              return r['ImageId']


          def wait_available(ec2_client, ami_id, max_attempts=60, delay=15):
              for _ in range(max_attempts):
                  imgs = ec2_client.describe_images(ImageIds=[ami_id])['Images']
                  if not imgs:
                      raise RuntimeError(f'{ami_id}: image not found')
                  state = imgs[0]['State']
                  if state == 'available':
                      return
                  if state == 'failed':
                      raise RuntimeError(f'{ami_id}: copy entered failed state')
                  time.sleep(delay)
              raise TimeoutError(f'{ami_id}: timed out after {max_attempts * delay}s')


          def tag_and_share(ec2_client, ami_id, src_ami):
              ec2_client.create_tags(Resources=[ami_id], Tags=COMMON_TAGS + [
                  {'Key': 'Name',        'Value': f'{APP_NAME} AMI'},
                  {'Key': 'SourceAmiId', 'Value': src_ami},
              ])
              if ENVIRONMENT == 'prd':
                  # Share with the entire organisation
                  permission = {'Add': [{'OrganizationArn': ORG_ARN}]}
              else:
                  # Dev: share only with the designated sample account
                  permission = {'Add': [{'UserId': DEV_ACCOUNT}]}
              ec2_client.modify_image_attribute(
                  ImageId=ami_id,
                  LaunchPermission=permission,
              )


          def cleanup_region(region):
              ec2 = boto3.client('ec2', region_name=region)
              imgs = ec2.describe_images(
                  Owners=['self'],
                  Filters=[
                      {'Name': 'name',          'Values': [AMI_NAME]},
                      {'Name': 'tag:ManagedBy', 'Values': ['CloudFormation']},
                  ],
              )['Images']
              for img in imgs:
                  snaps = [
                      b['Ebs']['SnapshotId']
                      for b in img.get('BlockDeviceMappings', [])
                      if 'Ebs' in b
                  ]
                  try:
                      ec2.deregister_image(ImageId=img['ImageId'])
                  except Exception as e:
                      print(f"deregister {img['ImageId']}: {e}")
                  for s in snaps:
                      try:
                          ec2.delete_snapshot(SnapshotId=s)
                      except Exception as e:
                          print(f"delete snapshot {s}: {e}")


          def handler(event, context):
              is_cfn = 'ResponseURL' in event
              print(json.dumps({k: v for k, v in event.items() if k != 'ResponseURL'}))

              try:
                  req_type = event.get('RequestType', 'Create')

                  if req_type == 'Delete':
                      cleanup_region('us-east-2')
                      cleanup_region('us-east-1')
                      if is_cfn:
                          cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  # Resolve current source AMI in each target region independently
                  src_use2 = resolve_sg_ami('us-east-2')
                  src_use1 = resolve_sg_ami('us-east-1')
                  print(f'Source AMIs — us-east-2: {src_use2}  us-east-1: {src_use1}')

                  ec2_use2 = boto3.client('ec2', region_name='us-east-2')
                  ec2_use1 = boto3.client('ec2', region_name='us-east-1')

                  # Start both copies simultaneously; AWS runs them in parallel
                  ami_use2 = start_copy(ec2_use2, src_use2, KMS_USE2, 'us-east-2')
                  ami_use1 = start_copy(ec2_use1, src_use1, KMS_USE1, 'us-east-1')
                  print(f'Copies started — us-east-2: {ami_use2}  us-east-1: {ami_use1}')

                  # Poll both; since copies run in parallel the second wait is short
                  wait_available(ec2_use2, ami_use2)
                  wait_available(ec2_use1, ami_use1)

                  tag_and_share(ec2_use2, ami_use2, src_use2)
                  tag_and_share(ec2_use1, ami_use1, src_use1)

                  # Update internal SSM parameter
                  ssm = boto3.client('ssm', region_name='us-east-2')
                  ssm.put_parameter(
                      Name=SSM_PARAM,
                      Value=ami_use2,
                      Type='String',
                      Description='Ops-owned Storage Gateway FILE_S3 AMI ID (us-east-2)',
                      Overwrite=True,
                  )
                  try:
                      ssm.add_tags_to_resource(
                          ResourceType='Parameter',
                          ResourceId=SSM_PARAM,
                          Tags=[
                              {'Key': 'GatewayType', 'Value': 'FILE_S3'},
                              {'Key': 'ManagedBy',   'Value': 'CloudFormation'},
                          ],
                      )
                  except Exception as e:
                      print(f'add_tags_to_resource (non-fatal): {e}')

                  result = {'AmiId': ami_use2, 'AmiIdUSE1': ami_use1}
                  if is_cfn:
                      cfnresponse.send(
                          event, context, cfnresponse.SUCCESS, result,
                          physicalResourceId=ami_use2,
                      )
                  return result

              except Exception as exc:
                  print(f'FAILED: {exc}')
                  if is_cfn:
                      cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(exc)})
                  raise

  # ── Custom Resource — trigger AMI copy on stack create / update ──────────────
  # SourceAmiId resolves to the actual AMI ID (via AWS::SSM::Parameter::Value).
  # When AWS releases a new Storage Gateway AMI, updating the stack re-triggers
  # the Lambda because this property value changes.

  AmiCopy:
    Type: Custom::AmiCopy
    Properties:
      ServiceToken: !GetAtt AmiCopyLambda.Arn
      SourceAmiId: !Ref StorageGatewaySsmPath

  # ── EventBridge Rule — scheduled weekly AMI refresh ──────────────────────────
  # Replaces the Image Builder pipeline schedule. Invokes Lambda directly;
  # no build instance, no SSM Agent requirement.

  AmiRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AppName}-ami-refresh"
      Description: !Sub "Weekly Storage Gateway FILE_S3 AMI copy for ${AppName}"
      ScheduleExpression: !If
        - IsProd
        - "cron(30 6 ? * 1 *)"
        - "cron(30 6 ? * 4 *)"
      State: ENABLED
      Targets:
        - Id: AmiCopyLambda
          Arn: !GetAtt AmiCopyLambda.Arn
          Input: '{"RequestType": "Create"}'

  AmiRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AmiCopyLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AmiRefreshRule.Arn

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  AMIId:
    Value: !GetAtt AmiCopy.AmiId
    Description: ID of the Operations-owned Storage Gateway FILE_S3 AMI (us-east-2).
    Export:
      Name: !Sub "${AWS::StackName}-AMIId"

  AMIIdUSE1:
    Value: !GetAtt AmiCopy.AmiIdUSE1
    Description: ID of the Operations-owned Storage Gateway FILE_S3 AMI (us-east-1).
    Export:
      Name: !Sub "${AWS::StackName}-AMIIdUSE1"

  InternalSsmParamName:
    Value: "/internal/amis/storage-gateway/file-s3/latest"
    Description: Internal SSM parameter holding the Operations-owned AMI ID (us-east-2).
    Export:
      Name: !Sub "${AWS::StackName}-SsmParamName"

  LambdaFunctionArn:
    Value: !GetAtt AmiCopyLambda.Arn
    Description: ARN of the AMI copy Lambda — invoke manually to force an immediate refresh.
    Export:
      Name: !Sub "${AWS::StackName}-LambdaArn"

  RefreshRuleArn:
    Value: !GetAtt AmiRefreshRule.Arn
    Description: ARN of the EventBridge rule driving the weekly AMI refresh schedule.
    Export:
      Name: !Sub "${AWS::StackName}-RefreshRuleArn"
