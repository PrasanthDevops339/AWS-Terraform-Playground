# ============================================================================
# GitLab CI/CD — OPA EFS Encryption Policy Check Stage
# ============================================================================
# Merge this into your existing .gitlab-ci.yml
# Prerequisites: terraform plan has already run → tfplan.binary artifact
# ============================================================================

stages:
  - validate
  - plan
  - policy_check    # ← Add between plan and apply
  - apply

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variables:
  OPA_VERSION: "1.4.2"
  POLICY_DIR: "opa/policy"
  TEST_DIR: "opa/tests"

# ---------------------------------------------------------------------------
# Stage: OPA Policy Check (runs on MR + default branch)
# ---------------------------------------------------------------------------
opa_efs_encryption_check:
  stage: policy_check
  image: hashicorp/terraform:1.7
  needs:
    - job: terraform_plan      # ← Adjust to match your plan job name
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
    - curl -sL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
    - chmod +x /usr/local/bin/opa
    - opa version
  script:
    # 1. Convert binary plan → JSON
    - terraform show -json tfplan.binary > tfplan.json

    # 2. Run OPA unit tests (validate policies themselves)
    - echo "════════ OPA Unit Tests ════════"
    - opa test ${POLICY_DIR} ${TEST_DIR} -v --format pretty

    # 3. Evaluate policy against the plan
    - echo ""
    - echo "════════ EFS Encryption Policy Check ════════"
    - |
      VIOLATIONS=$(opa eval \
        --data ${POLICY_DIR} \
        --input tfplan.json \
        --format json \
        'data.terraform.efs.encryption.violations')

      COUNT=$(echo "${VIOLATIONS}" | jq -r '.result[0].expressions[0].value | length')

      echo "Violations found: ${COUNT}"

      if [ "${COUNT}" -gt 0 ]; then
        echo ""
        echo "❌ POLICY VIOLATIONS:"
        echo "${VIOLATIONS}" | jq -r '.result[0].expressions[0].value[] | "  ▸ \(.severity): \(.message)"'
        echo ""
        echo "Pipeline blocked — fix violations and re-push."
        exit 1
      else
        echo "✅ All EFS resources compliant with KMS encryption at rest policy."
      fi
  artifacts:
    when: always
    paths:
      - tfplan.json
    reports:
      # Optional: expose violations as CI report
      dotenv: policy_results.env
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
