[aws:ssm:patch:outcome]
INDEXED_EXTRACTIONS     = json
KV_MODE                 = none
SHOULD_LINEMERGE        = false
LINE_BREAKER            = ([\r\n]+)
TRUNCATE                = 4000

# Event time, never ingest time.
TIMESTAMP_FIELDS        = event_time
TIME_FORMAT             = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
