[aws:ssm:patch:outcome]
INDEXED_EXTRACTIONS     = json
KV_MODE                = none
SHOULD_LINEMERGE        = false
LINE_BREAKER           = ([\r\n]+)
TRUNCATE               = 10000
TIMESTAMP_FIELDS       = event_time
TIME_FORMAT            = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 32

# Search-time configuration belongs on the search tier as well as the parsing
# stanza on the ingestion tier. Preserve the raw status_details field.
EVAL-lookup_status = coalesce(status_details, status, "unknown")
LOOKUP-patch_outcome_action = patch_outcome_action patch_outcome status_details AS lookup_status OUTPUTNEW action AS recommended_action
